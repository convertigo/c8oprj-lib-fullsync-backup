    ↓get_databases_name [steps.SimpleStep-1773075661863]: 
      expression: |
        'var fs_cdb_props = context.httpSession.getAttribute("fs_cdb_props");
        
        if (fs_cdb_props != null) {
            function getProp(key) {
                var value;
        
                if (typeof fs_cdb_props.get == "function") {
                    value = fs_cdb_props.get(key);
                } else {
                    value = fs_cdb_props[key];
                }
        
                return value == null ? null : String(value);
            }
        
            try {
                cdb_prefix = getProp("cdb_prefix");
        
                // Un préfixe absent ou vide est valide.
                if (cdb_prefix == null) {
                    cdb_prefix = "";
                }
        
                fsclient = com.twinsoft.convertigo.engine.Engine.theApp.couchDbManager.getFullSyncClient();
        
                query = new java.util.HashMap();
                limit = "1000";
                skip = "0";
        
                query.put("startkey", "\"" + cdb_prefix + "\"");
                query.put("endkey", "\"" + cdb_prefix + "\uffff\"");
                query.put("limit", limit);
                query.put("skip", skip);
        
                var all_dbs = JSON.parse(fsclient.getAllDbs(query)).items
                    .map(function (item) {
                        return cdb_prefix.length ? item.split(cdb_prefix)[1] : item;
                    })
                    .filter(function (item) {
                        return item.indexOf("_") != 0;
                    });
        
            } catch (e) {
                log.warning(">>> Error: " + e);
            }
        } else {
            log.warn("Error: Can not find Fullsync properties.");
        }'
